<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My listening, 2024-2026</title>
<style>
:root{--bg:#121212;--card:#1c1c1e;--ink:#f2f2f2;--dim:#9a9aa0;--acc:#1ed760;--acc2:#ff7ab6;--line:#2c2c30}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,Segoe UI,sans-serif}
header{padding:28px 16px 8px;max-width:960px;margin:auto}h1{margin:0;font-size:28px}header p{color:var(--dim);margin:6px 0}
nav{display:flex;gap:8px;max-width:960px;margin:12px auto;padding:0 16px;flex-wrap:wrap;position:sticky;top:0;background:var(--bg);padding-top:8px;padding-bottom:8px;z-index:2}
nav button{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:20px;padding:7px 18px;cursor:pointer;font-size:15px}
nav button.on{background:var(--acc);color:#000;border-color:var(--acc);font-weight:600}
main{max-width:960px;margin:auto;padding:0 16px 60px}
h2{font-size:18px;margin:30px 0 4px}.sub{color:var(--dim);font-size:13px;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.big{font-size:30px;font-weight:700;color:var(--acc);line-height:1.1}.lbl{color:var(--dim);font-size:13px;margin-top:4px}
.fun{background:linear-gradient(135deg,#1c2a22,#1c1c1e);border-color:#274a35}.fun .big{font-size:20px;color:var(--ink)}
.row{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:14px}.row .n{width:34%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .b{flex:1;background:#26262a;border-radius:4px;height:16px}.row .b i{display:block;height:100%;border-radius:4px;background:var(--acc)}
.row .v{width:90px;text-align:right;color:var(--dim);font-size:13px}.row small{color:var(--dim)}
.cols{display:flex;align-items:flex-end;gap:3px;height:130px;margin-top:6px}.cols div{flex:1;background:var(--acc);border-radius:3px 3px 0 0;min-height:2px;position:relative}
.cols div.hi{background:var(--acc2)}.cap{display:flex;gap:3px;color:var(--dim);font-size:11px}.cap span{flex:1;text-align:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:700px){.two{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-size:14px}td{padding:4px 6px;border-bottom:1px solid var(--line)}td:last-child{text-align:right;color:var(--dim)}table.cmp td:last-child{text-align:left;color:var(--ink)}
.note{color:var(--dim);font-size:12.5px;margin-top:40px;border-top:1px solid var(--line);padding-top:12px}
#err{color:#ff8080;padding:20px;max-width:960px;margin:auto}
</style></head><body>
<header><h1>My listening, 2024 - 2026</h1><p>A friendlier look at the Extended Streaming History. Pick a year. Everything is counted from your own export, in your browser.</p></header>
<nav id="nav"></nav><main id="app"></main><div id="err"></div>
<script>
const $=(s,e=document)=>e.querySelector(s),MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f1=n=>n.toLocaleString(undefined,{maximumFractionDigits:1});
const date=s=>new Date(s+(s.length==10?'T00:00:00Z':'')).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric',timeZone:'UTC'});
const hr=h=>h==0?'12am':h<12?h+'am':h==12?'12pm':(h-12)+'pm';
let D,cur='2025';
fetch('fun-stats.json').then(r=>r.json()).then(j=>{D=j;nav();show()}).catch(()=>$('#err').textContent='fun-stats.json not found. Run: node scripts/active/build_fun_stats.js, then open this page through the local server (scripts/active/serve.py).');
function nav(){const n=$('#nav');n.innerHTML='';[...Object.keys(D.years),'Compare'].forEach(y=>{const b=document.createElement('button');b.textContent=y;b.className=y==cur?'on':'';b.onclick=()=>{cur=y;nav();show();scrollTo(0,0)};n.append(b)})}
const bars=(list,key='hours',unit='h',sub)=>{const m=Math.max(...list.map(x=>x[key]))||1;return list.map(x=>`<div class="row"><div class="n" title="${esc(x.name)}">${esc(x.name)}${sub&&x.sub?` <small>${esc(x.sub)}</small>`:''}</div><div class="b"><i style="width:${100*x[key]/m}%"></i></div><div class="v">${f1(x[key])}${unit}${x.plays?` · ${x.plays}x`:''}</div></div>`).join('')};
const cols=(arr,labels,hiIdx)=>{const m=Math.max(...arr)||1;return `<div class="cols">${arr.map((v,i)=>`<div class="${i==hiIdx?'hi':''}" style="height:${100*v/m}%" title="${labels[i]}: ${v}h"></div>`).join('')}</div><div class="cap">${labels.map((l,i)=>`<span>${arr.length>12&&i%3?'':l}</span>`).join('')}</div>`};
const max=a=>a.indexOf(Math.max(...a));
function persona(s){const h=max(s.hourHrs),night=s.hourHrs.slice(0,5).concat(s.hourHrs.slice(22)).reduce((a,b)=>a+b,0)/s.hours;
 return night>.3?`Night owl: ${Math.round(100*night)}% of your listening happens between 10pm and 5am (UTC).`:h>=5&&h<12?'Morning listener: your peak hour is '+hr(h)+' (UTC).':h<17?'Daytime listener: your peak hour is '+hr(h)+' (UTC).':'Evening listener: your peak hour is '+hr(h)+' (UTC).'}
function show(){const app=$('#app');if(cur=='Compare')return compare(app);const s=D.years[cur],partial=cur=='2026';
 const day=s.hours/24,hpd=s.hours/s.daysListened;
 const fun=[[`${f1(day)} days`,`of non-stop music: ${f1(s.hours)} hours total${partial?' (2026 so far)':''}`],
 [`${s.daysListened} days`,`you listened on. That is ${f1(hpd)} hours on a typical listening day`],
 [`${f1(s.longestSession.hours)}h in one go`,`your longest binge, ${date(s.longestSession.start.slice(0,10))} (a gap over 30 min ends a session)`],
 [`${s.streak.n} days in a row`,`your longest listening streak, ending ${date(s.streak.end)}`],
 [`${f1(s.busiestDay.hours)}h on ${date(s.busiestDay.day)}`,`your busiest single day`],
 s.repeatDay?[`${s.repeatDay.plays}x in a day`,`"${s.repeatDay.name.trim()}" by ${s.repeatDay.artist}, on ${date(s.repeatDay.day)}`]:null,
 [`${s.skipPct}% skipped`,`of ${s.rows.toLocaleString()} plays were marked skipped`],
 [`${s.bailedPct}% bailed early`,`${s.shortPlays.toLocaleString()} plays lasted under 30 seconds`],
 [`${s.uniqueArtists.toLocaleString()} artists`,`${s.uniqueSongs.toLocaleString()} different songs`],
 [`${s.newArtists} new artists`,`you heard properly (30 s+) for the first time, versus everything before 2024`]].filter(Boolean);
 const mx=s.monthTop,mi=max(s.monthHrs);
 app.innerHTML=`<h2>${cur} in a nutshell</h2><p class="sub">${esc(persona(s))}</p>
 <div class="grid">${fun.map(([a,b])=>`<div class="card fun"><div class="big">${esc(a)}</div><div class="lbl">${esc(b)}</div></div>`).join('')}</div>
 <h2>Top artists</h2><p class="sub">By hours listened. "x" is number of plays.</p><div class="card">${bars(s.topArtists)}</div>
 <div class="two"><div><h2>Top songs</h2><p class="sub">By hours listened.</p><div class="card">${bars(s.topSongs.slice(0,8),'hours','h',true)}</div></div>
 <div><h2>Top albums</h2><p class="sub">Albums you spent the most time in.</p><div class="card">${bars(s.topAlbums,'hours','h',true)}</div>
 ${s.mostReplayedSong?`<div class="card fun" style="margin-top:10px"><div class="big">${esc(s.mostReplayedSong.name.trim())}</div><div class="lbl">Most replayed song: ${s.mostReplayedSong.plays} plays, by ${esc(s.mostReplayedSong.artist)}</div></div>`:''}</div></div>
 <h2>When you listen</h2><p class="sub">Hours of music by hour of the day (UTC, as stored in the export). Pink is your peak.</p><div class="card">${cols(s.hourHrs,s.hourHrs.map((_,i)=>hr(i)),max(s.hourHrs))}</div>
 <div class="two"><div><h2>By weekday</h2><div class="card">${cols(s.dowHrs,DOW,max(s.dowHrs))}</div></div>
 <div><h2>By month</h2><div class="card">${cols(s.monthHrs,MON,mi)}</div></div></div>
 <h2>Song of each month</h2><p class="sub">The most-listened song in each month.</p><div class="card"><table>${mx.map((m,i)=>m?`<tr><td>${MON[i]}</td><td>${esc(m.name.trim())} <small style="color:var(--dim)">${esc(m.artist)}</small></td><td>${m.plays}x</td></tr>`:'').join('')}</table></div>
 <div class="two"><div><h2>How songs start</h2><p class="sub">What triggered each play.</p><div class="card">${reasons(s.startReason,START)}</div></div>
 <div><h2>How songs end</h2><p class="sub">What ended each play.</p><div class="card">${reasons(s.endReason,END)}</div></div></div>
 <div class="two"><div><h2>Where you listened from</h2><p class="sub">Country of the connection, by hours.</p><div class="card">${bars(s.countries)}</div></div>
 <div><h2>On what</h2><p class="sub">Device type, by hours.</p><div class="card">${bars(s.platforms)}</div></div></div>
 ${s.newArtistSample.length?`<h2>New obsessions</h2><p class="sub">Artists you had never really played before 2024 and then spent the most time on this year.</p><div class="card">${bars(s.newArtistSample.map(a=>({name:a.name,hours:a.hours,sub:'first heard '+date(a.first)})),'hours','h',true)}</div>`:''}
 ${s.topShows.length?`<h2>Podcasts</h2><div class="card">${bars(s.topShows)}</div>`:''}
 <div class="note">Notes: times are UTC (the export does not record your local time zone), so a late-night peak may sit a few hours off. "Skipped" is Spotify's own flag; "bailed early" is my own count of plays under 30 seconds. ${partial?'2026 only runs up to the export date. ':''}Your Spotify export README (ReadMeFirst PDF) is the official field guide; I could not open it here, so field meanings are from the standard export format. IP addresses are never shown.</div>`}
const START={clickrow:'You clicked it',trackdone:'Previous song finished',fwdbtn:'You pressed next',playbtn:'You pressed play',backbtn:'You pressed back',appload:'App opened',remote:'Remote control',clickside:'You clicked a side item',endplay:'Play ended',unknown:'Unknown',popup:'Popup'};
const END={trackdone:'Song finished',fwdbtn:'You pressed next',endplay:'You stopped it',logout:'Logged out',backbtn:'You pressed back',unexpected_exit:'App closed',remote:'Remote control',clickrow:'You picked another',unknown:'Unknown','unexpected-exit-while-paused':'Closed while paused',appload:'App opened'};
function reasons(list,map){const t=list.reduce((a,x)=>a+x[1],0);return list.map(([k,v])=>`<div class="row"><div class="n">${esc(map[k]||k)}</div><div class="b"><i style="width:${100*v/t}%"></i></div><div class="v">${Math.round(100*v/t)}%</div></div>`).join('')}
function compare(app){const ys=Object.keys(D.years),rows=[['Hours listened',s=>f1(s.hours)],['Days you listened',s=>s.daysListened],['Typical hours per listening day',s=>f1(s.hours/s.daysListened)],['Plays',s=>s.rows.toLocaleString()],['Different artists',s=>s.uniqueArtists.toLocaleString()],['Different songs',s=>s.uniqueSongs.toLocaleString()],['Skipped %',s=>s.skipPct],['Bailed under 30 s %',s=>s.bailedPct],['Shuffle %',s=>s.shufflePct],['Longest binge (h)',s=>f1(s.longestSession.hours)],['Longest streak (days)',s=>s.streak.n],['Peak hour (UTC)',s=>hr(max(s.hourHrs))],['Top artist',s=>esc(s.topArtists[0].name)],['Top song',s=>esc(s.topSongs[0].name.trim())]];
 app.innerHTML=`<h2>Year against year</h2><p class="sub">2026 is a partial year, so its totals are lower.</p><div class="card"><table class="cmp"><tr><td></td>${ys.map(y=>`<td><b>${y}</b></td>`).join('')}</tr>${rows.map(([l,f])=>`<tr><td>${l}</td>${ys.map(y=>`<td style="color:var(--ink)">${f(D.years[y])}</td>`).join('')}</tr>`).join('')}</table></div>
 <h2>Hours per month</h2>${ys.map(y=>`<p class="sub" style="margin-top:14px">${y}</p><div class="card">${cols(D.years[y].monthHrs,MON,max(D.years[y].monthHrs))}</div>`).join('')}`}
</script></body></html>
